# ramp-exporter configuration — copy to config.yml and fill in.
# Secrets come from ENV VARS (see .env.example), never this file.

format_version: "1.0"          # the export-bundle contract this run targets

source:
  api_base: https://api.ramp.com/developer/v1
  # Auth via env: RAMP_CLIENT_ID + RAMP_CLIENT_SECRET (OAuth2 client-credentials).
  # Customer admin mints a READ-ONLY app: Ramp dashboard -> Settings -> Developer.
  scopes:                      # least privilege, read-only
    - users:read
    - departments:read
    - locations:read
    - entities:read
    - cards:read
    - spend_programs:read
    - funds:read
    - vendors:read
    - bills:read
    - transactions:read
  # Scope slugs verified against Ramp's OpenAPI (see docs/ramp-api-notes.md).

export:
  # Categories to export. Each expands to a set of raw Ramp resources (raw-faithful, JSONL).
  categories:
    - users                    # -> users, departments, locations, entities
    - cards                    # -> cards, spend-programs, funds  (funds = current name for the legacy "limits")
    - vendors                  # -> vendors + bills/transactions METADATA (no receipt binaries)
  mode: full                   # full snapshots only — no incremental in v1
  filters:
    # Bounds the vendors ledger pull. Users/cards ignore this.
    date_range: { from: "2023-01-01", to: "2026-06-17" }

output:
  backend: local               # v1 = local only (cloud bucket / SFTP = v2)
  path: ./exports              # bundle written to {path}/ramp/{run_id}/

runtime:
  rate_limit_rps: 8            # be a good API citizen
  max_retries: 6               # exponential backoff + jitter; honors Retry-After
  log_format: text             # text | json

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Export · Slash</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --color-surface-subtle: oklch(98% 0.002 67);
    --color-surface-neutral: oklch(100% 0 0);
    --color-bg-neutral-subtle: oklch(99.1% 0.001 108);
    --color-bg-neutral-prominent: oklch(96.4% 0.003 84.6);
    --color-bg-cta: oklch(31.2% 0.009 97.7);
    --color-border-subtle: oklch(92.8% 0.006 84.6);
    --color-border-normal: oklch(91.3% 0.008 91.6);
    --color-border-prominent: oklch(89.8% 0.010 87.5);
    --color-text-subtle: oklch(65.1% 0.020 86.2);
    --color-text-normal: oklch(51.9% 0.015 82.4);
    --color-text-prominent: oklch(31.2% 0.009 97.7);
    --color-text-on-bold: oklch(99.1% 0.001 108);
    --color-accent-bg-subtle: oklch(97.9% 0.021 101.1);
    --color-accent-bg-prominent: oklch(94.6% 0.045 97.6);
    --color-accent-border: oklch(91% 0.073 96.6);
    --color-accent-bold: oklch(65.2% 0.131 91.7);
    --color-accent-text: oklch(52.1% 0.104 93);
    --color-success-bg: oklch(94.2% 0.032 148.3);
    --color-success-text: oklch(50.3% 0.152 144.4);
    --color-warning-bg: oklch(94.7% 0.031 81.8);
    --color-warning-text: oklch(52.9% 0.117 56.8);
    --color-danger-bg: oklch(95.2% 0.020 13.4);
    --color-danger-text: oklch(54.2% 0.178 23.6);
    --color-info-text: oklch(51.9% 0.135 248.6);
    /* red-200 / red-500 / red-1000 / red-1100 from design-system-v2 tailwind.css (InfoCardV2 danger) */
    --color-danger-surface: oklch(98.18% 0.008 6.66);
    --color-danger-border: oklch(93.34% 0.028 14.74);
    --color-danger-title: oklch(67.31% 0.167 20.06);
    --color-danger-body: oklch(54.19% 0.178 23.64);
    --shadow-card: 0 1px 1px 0 oklch(19.05% 0.01 97.9 / 5%);
    --font-sans: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 450;
    color: var(--color-text-normal); background: var(--color-surface-subtle);
    -webkit-font-smoothing: antialiased; font-synthesis: none;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); }
  .caption { font-size: 13px; line-height: 18px; letter-spacing: 0.15px; }
  .subtle { color: var(--color-text-subtle); }
  .prominent { color: var(--color-text-prominent); }

  /* shell */
  .app { display: flex; flex-direction: column; height: 100vh; padding: 16px 8px 8px; }
  .app-header { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px 16px; flex-shrink: 0; }
  .app-header .actions { display: flex; align-items: center; gap: 8px; }
  .local-tag { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--color-border-normal); background: var(--color-bg-neutral-subtle); }
  .layout { display: flex; flex-direction: column; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; background: var(--color-surface-neutral); border: 1px solid var(--color-border-normal); }
  .progress { height: 4px; flex-shrink: 0; background: var(--color-bg-neutral-subtle); }
  .progress > div { height: 4px; background: var(--color-accent-bold); transition: width .3s ease; }
  .body { display: flex; flex: 1; min-height: 0; }

  /* steps rail */
  .steps { display: flex; flex-direction: column; align-items: flex-end; width: 424px; flex-shrink: 0; padding-top: 32px; }
  .steps ol { display: flex; flex-direction: column; gap: 4px; width: 280px; padding: 0 32px 0 0; margin: 0; list-style: none; }
  .step { display: flex; align-items: center; gap: 8px; height: 32px; width: 248px; padding: 0 8px; border-radius: 10px; border: 0; background: none; text-align: left; font-weight: 525; color: var(--color-text-subtle); cursor: default; }
  .step .ico { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; }
  .step[data-state="current"] { background: var(--color-bg-neutral-subtle); color: var(--color-text-prominent); }
  .step[data-state="done"] { color: var(--color-success-text); }
  .step[data-state="done"]:not(:disabled) { cursor: pointer; }
  .step[data-state="done"]:not(:disabled):hover { background: var(--color-bg-neutral-subtle); }

  /* form column */
  .column { display: flex; flex-direction: column; width: 578px; flex-shrink: 0; padding: 32px 64px 0; min-height: 0; }
  .column.wide { width: 1000px; }
  .column h2 { margin: 0; padding-bottom: 16px; font-size: 24px; line-height: 28px; letter-spacing: -0.15px; font-weight: 600; color: var(--color-text-prominent); flex-shrink: 0; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 0 8px 16px; }
  .fields { display: flex; flex-direction: column; gap: 16px; }
  .flow-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; height: 64px; padding: 16px 0; flex-shrink: 0; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 6px; font-weight: 525; white-space: nowrap; border: 1px solid transparent; }
  .btn.cta { background: var(--color-bg-cta); color: var(--color-text-on-bold); }
  .btn.outline { background: var(--color-surface-neutral); border-color: var(--color-border-prominent); color: var(--color-text-prominent); box-shadow: var(--shadow-card); }
  .btn.sm { height: 28px; padding: 0 8px; font-size: 13px; line-height: 18px; }
  .btn.xs { height: 24px; padding: 0 6px; font-size: 13px; line-height: 18px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.outline:not(:disabled):hover { background: var(--color-bg-neutral-subtle); }
  .btn.cta:not(:disabled):hover { background: oklch(25% 0.009 97.7); }
  :focus-visible { outline: 2px solid var(--color-accent-bold); outline-offset: 2px; }

  /* fields */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { display: flex; gap: 4px; font-weight: 525; }
  .field label .req { color: var(--color-danger-text); font-size: 13px; }
  .input { display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--color-border-normal); background: var(--color-bg-neutral-subtle); box-shadow: var(--shadow-card); }
  .input:focus-within { border-color: var(--color-accent-bold); box-shadow: 0 0 0 3px var(--color-accent-bg-prominent); }
  .input input, .input select { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--color-text-prominent); }
  .input input::placeholder { color: var(--color-text-subtle); }
  .input select { appearance: none; cursor: pointer; }
  .input.select { padding-right: 8px; }
  .input .icon-btn { display: flex; padding: 4px; margin-right: -4px; border: 0; background: none; border-radius: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* cards */
  .card { border-radius: 8px; border: 1px solid var(--color-border-normal); background: var(--color-surface-neutral); box-shadow: var(--shadow-card); overflow: hidden; }
  .card-head { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; background: var(--color-surface-subtle); border-bottom: 1px solid var(--color-border-subtle); font-weight: 525; color: var(--color-text-prominent); }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--color-info-text); font-weight: 525; text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .setup-steps { display: flex; flex-direction: column; gap: 12px; padding: 12px; margin: 0; list-style: none; color: var(--color-text-prominent); }
  .setup-steps li { display: flex; gap: 10px; }
  .num { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; border-radius: 999px; background: var(--color-bg-neutral-prominent); font-size: 12px; font-weight: 525; color: var(--color-text-normal); }
  .scopes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .scope { padding: 0 6px; border-radius: 4px; background: var(--color-bg-neutral-prominent); font-family: var(--font-mono); font-size: 12px; line-height: 20px; color: var(--color-text-normal); }
  .scope.missing { background: var(--color-danger-border); color: var(--color-danger-body); }

  /* error card (InfoCardV2 danger) */
  .alert { display: flex; gap: 8px; padding: 12px; border-radius: 6px; border: 1px solid var(--color-danger-border); background: var(--color-danger-surface); box-shadow: var(--shadow-card); }
  .alert svg { flex-shrink: 0; margin-top: 2px; }
  .alert .body-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .alert .title { font-weight: 525; color: var(--color-danger-title); }
  .alert .desc { color: var(--color-danger-body); }
  .alert .raw { margin-top: 4px; padding: 8px; border-radius: 6px; border: 1px solid var(--color-danger-border); background: oklch(100% 0 0 / 60%); font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--color-danger-body); overflow-wrap: anywhere; }

  /* category picker (ProductCard) */
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice { display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 10px; border: 1px solid var(--color-border-normal); background: var(--color-surface-subtle); text-align: left; }
  .choice[aria-checked="true"] { border-color: var(--color-accent-border); }
  .choice:hover { border-color: var(--color-border-prominent); }
  .choice[aria-checked="true"]:hover { border-color: var(--color-accent-bold); }
  .choice .tile { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 8px; background: var(--color-bg-neutral-prominent); }
  .choice .text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .choice .label { font-weight: 650; color: var(--color-text-prominent); }
  .choice .radio { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--color-border-prominent); background: var(--color-surface-neutral); }
  .choice[aria-checked="true"] .radio { border-color: var(--color-accent-bold); }
  .choice[aria-checked="true"] .radio::after { content: ""; width: 12px; height: 12px; border-radius: 999px; background: var(--color-accent-bold); }

  /* export progress */
  .rows { padding: 4px 0; }
  .prow { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; }
  .prow .ico { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; }
  .prow .name { flex: 1; }
  .prow .meta { color: var(--color-text-subtle); font-variant-numeric: tabular-nums; }
  .prow[data-state="waiting"] .name { color: var(--color-text-subtle); }
  .prow[data-state="running"] { background: var(--color-bg-neutral-subtle); }
  .prow[data-state="running"] .name { font-weight: 525; color: var(--color-text-prominent); }
  .spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* review */
  .agg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .agg b { font-weight: 525; color: var(--color-text-prominent); }
  .folder { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 4px 0 12px; border-radius: 8px; border: 1px solid var(--color-border-normal); background: var(--color-surface-subtle); }
  .folder code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 13px; line-height: 18px; }
  .tabs { display: flex; gap: 24px; height: 40px; border-bottom: 1px solid var(--color-border-subtle); }
  .tab { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--color-text-subtle); }
  .tab[aria-selected="true"] { border-bottom-color: var(--color-text-prominent); color: var(--color-text-prominent); font-weight: 525; }
  .count { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--color-bg-neutral-prominent); font-size: 13px; line-height: 18px; letter-spacing: 0.15px; font-weight: 450; color: var(--color-text-normal); }
  .tab[aria-selected="true"] .count { background: var(--color-accent-bg-prominent); color: var(--color-accent-text); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--color-border-normal); background: var(--color-surface-neutral); color: var(--color-text-normal); }
  .pill .n { color: var(--color-text-subtle); }
  .pill[aria-pressed="true"] { border-color: var(--color-accent-bold); background: radial-gradient(120% 140% at 50% 0%, var(--color-accent-bg-subtle) 0%, var(--color-accent-bg-prominent) 100%); color: var(--color-accent-text); font-weight: 525; }
  .pill[aria-pressed="true"] .n { color: var(--color-accent-text); font-weight: 450; }

  .table-card { border-radius: 8px; border: 1px solid var(--color-border-normal); background: var(--color-surface-neutral); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { padding: 0 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th:first-child, td:first-child { padding-left: 16px; }
  th:last-child, td:last-child { padding-right: 16px; }
  th { height: 37px; background: var(--color-surface-subtle); border-bottom: 1px solid var(--color-border-subtle); font-size: 13px; line-height: 18px; letter-spacing: 0.15px; font-weight: 450; color: var(--color-text-subtle); }
  td { height: 41px; border-bottom: 1px solid var(--color-border-subtle); color: var(--color-text-normal); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.selected { background: var(--color-bg-neutral-subtle); }
  .num-col { text-align: right; font-variant-numeric: tabular-nums; }
  td.money { color: var(--color-text-prominent); }
  td .mono { font-size: 13px; line-height: 18px; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--color-text-prominent); }
  .who span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .letter { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 6px; border: 1px solid var(--color-border-normal); background: var(--color-surface-neutral); font-size: 12px; font-weight: 600; color: var(--color-text-prominent); }
  .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 13px; line-height: 18px; letter-spacing: 0.15px; background: var(--color-bg-neutral-prominent); color: var(--color-text-normal); }
  .tag.success { background: var(--color-success-bg); color: var(--color-success-text); }
  .tag.warning { background: var(--color-warning-bg); color: var(--color-warning-text); }
  .tag.danger { background: var(--color-danger-bg); color: var(--color-danger-text); }
  .tag.lg { height: 24px; padding: 0 8px; border-radius: 6px; font-size: 14px; line-height: 20px; letter-spacing: 0; }
  .empty { padding: 40px 16px; text-align: center; color: var(--color-text-subtle); }

  /* drawer (PanelV2) */
  .backdrop { position: fixed; inset: 0; z-index: 10; }
  .backdrop .dim { position: absolute; inset: 0; background: #332D21; opacity: .35; }
  .backdrop .close { position: absolute; top: 8px; right: 416px; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: oklch(100% 0 0 / 15%); border: 1px solid oklch(100% 0 0 / 35%); }
  .panel { position: absolute; top: 8px; right: 8px; bottom: 8px; width: 400px; display: flex; flex-direction: column; border-radius: 10px; border: 1px solid var(--color-border-normal); background: var(--color-surface-neutral); overflow: hidden; }
  .panel-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 32px 20px 20px; background: linear-gradient(180deg, oklch(94.91% 0.004 91.62) 0%, var(--color-bg-neutral-subtle) 60%); text-align: center; flex-shrink: 0; }
  .panel-head .avatar { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--color-border-normal); background: var(--color-surface-neutral); box-shadow: var(--shadow-card); font-size: 20px; font-weight: 600; color: var(--color-text-prominent); }
  .panel-head .name { font-size: 18px; line-height: 24px; font-weight: 600; color: var(--color-text-prominent); }
  .panel-head .amount { margin-top: 4px; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.3px; color: var(--color-text-prominent); }
  .panel-head .amount small { font-size: 14px; line-height: 20px; font-weight: 450; letter-spacing: 0; color: var(--color-text-subtle); }
  .status-card { display: flex; align-items: center; justify-content: space-between; align-self: stretch; margin-top: 12px; padding: 12px; border-radius: 8px; border: 1px solid var(--color-border-subtle); background: var(--color-surface-neutral); box-shadow: var(--shadow-card); }
  .panel-body { display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0; padding: 16px 20px 20px; border-top: 1px solid var(--color-border-subtle); overflow-y: auto; }
  .details { border-radius: 8px; border: 1px solid var(--color-border-subtle); flex-shrink: 0; }
  .details > div { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; padding: 0 12px; border-bottom: 1px solid var(--color-border-subtle); }
  .details > div:last-child { border-bottom: 0; }
  .details dt { color: var(--color-text-subtle); flex-shrink: 0; }
  .details dd { margin: 0; color: var(--color-text-prominent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .details dd.mono { font-size: 13px; line-height: 18px; }
  .overline { font-size: 11px; line-height: 16px; font-weight: 525; letter-spacing: 0.6px; text-transform: uppercase; color: var(--color-text-subtle); }
  .raw-head { display: flex; align-items: center; justify-content: space-between; }
  pre.json { margin: 8px 0 0; padding: 12px; border-radius: 8px; border: 1px solid var(--color-border-subtle); background: var(--color-surface-subtle); font-family: var(--font-mono); font-size: 11px; line-height: 17px; color: var(--color-text-normal); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* additions: warning / info cards, platform tiles, hints */
  .alert.warn { border-color: oklch(91% 0.05 81.8); background: oklch(98.5% 0.012 81.8); }
  .alert.warn .title { color: var(--color-warning-text); }
  .alert.warn .desc { color: var(--color-text-normal); }
  .alert.info { border-color: var(--color-border-normal); background: var(--color-surface-subtle); }
  .alert.info .title { color: var(--color-text-prominent); }
  .alert.info .desc { color: var(--color-text-normal); }
  .skip-list { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 0; padding: 0 0 0 16px; color: var(--color-text-normal); }
  .skip-list b { font-weight: 525; color: var(--color-text-prominent); }
  .skip-list .scope { margin-left: 4px; }
  .choices.platforms { gap: 8px; }
  .choice.platform { height: 56px; padding: 0 16px 0 12px; gap: 12px; border-color: var(--color-border-subtle); background: var(--color-surface-neutral); }
  .choice.platform[aria-checked="true"] { border-color: var(--color-accent-border); background: var(--color-surface-subtle); }
  .choice.platform:hover { border-color: var(--color-border-prominent); }
  .choice.platform[aria-checked="true"]:hover { border-color: var(--color-accent-bold); }
  .choice.platform .logo { width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; outline: 1px solid rgba(21, 20, 15, .075); outline-offset: -1px; }
  .choice.platform .label { flex: 1; font-weight: 525; }
  .choice[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
  .choice[aria-disabled="true"]:hover { border-color: var(--color-border-normal); }
  .choice-warn { display: block; margin-top: 2px; color: var(--color-warning-text); }
  .hint { color: var(--color-warning-text); }
  .link-btn { padding: 0; border: 0; background: none; color: var(--color-info-text); font-weight: 525; }
  .link-btn:hover { text-decoration: underline; }
  .prow[data-state="skipped"] .name, .prow[data-state="skipped"] .meta { color: var(--color-text-subtle); }
  .prow[data-state="failed"] .meta { color: var(--color-danger-text); }
  .pill .tag { height: 18px; font-size: 12px; }

  @media (max-width: 1100px) {
    .steps { display: none; }
    .column, .column.wide { width: 100%; max-width: 1000px; margin: 0 auto; padding: 32px 24px 0; }
  }
</style>
</head>
<body>

function errorCopy(err) {
  const s = src(), label = s?.label || "the platform";
  const status = err.status;
  const credName = s ? listOf(s.credentials.map((c) => c.label)) : "credentials";
  if (err.network) {
    return { title: "Couldn’t reach the exporter", desc: "Is ramp-exporter ui still running in your terminal? Start it again, then retry." };
  }
  switch (err.kind) {
    case "request":
      return { title: "Check the form", desc: err.error };
    case "auth": {
      const scopes = err.missingScopes || [];
      if (s?.id === "ramp" && status === 403) {
        return scopes.length
          ? { title: "Ramp turned down this app (403)", desc: `Turn on ${scopes.join(", ")} for this app in Ramp, then try again. Your Client ID and Secret don’t change.` }
          : { title: "Ramp turned down this app (403)", desc: `The app is missing one or more of the ${s.scopes.length} read scopes below. Turn them all on in Ramp, then try again.` };
      }
      const extra = s?.id === "mercury" ? " A read-write token also needs this computer’s IP on its allowlist; a read-only token doesn’t." : "";
      return { title: `${label} didn’t accept this ${credName.toLowerCase()}${status ? ` (${status})` : ""}`, desc: `Copy it again from ${label} — it may have expired or been revoked.${extra}` };
    }
    case "forbidden":
      return { title: `${label} denied access${status ? ` (${status})` : ""}`, desc: `This ${credName.toLowerCase()} can’t read some of what you picked. Create one with read access to everything, then reconnect.` };
    case "rate_limited":
      return { title: `${label} is rate-limiting this token`, desc: "Wait a minute, then try again. Files that finished are kept only when the whole export completes." };
    case "server":
      return { title: `${label} is having trouble${status ? ` (${status})` : ""}`, desc: "This is on their side. Try again in a few minutes." };
    case "network":
      return { title: `Couldn’t reach ${label}`, desc: "Check this computer’s internet connection, then try again." };
    case "protocol":
      return { title: `${label} sent a response the exporter didn’t expect`, desc: err.error || "Try again; if it keeps happening, share the error with the Slash team." };
    case "bad_request":
      if (status === 422) return { title: `${label} rejected the request (422)`, desc: "Pick a different history range, or export all history." };
      return { title: `${label} rejected the request${status ? ` (${status})` : ""}`, desc: err.error || "Try again in a moment." };
    case "not_found":
      return { title: `${label} doesn’t have this for your account`, desc: err.error || "Try again in a moment." };
    default:
      return { title: `Something went wrong talking to ${label}`, desc: err.error || "Try again in a moment." };
  }
}

  let res;
  try {
    res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  } catch {
    return { ok: false, network: true };
  }
  try { return await res.json(); }
  catch { return { ok: false, error: `The exporter answered ${res.status} without details.` }; }
}

async function connect() {
  if (state.busy) return;
  const s = src(), creds = credentials();
  const missing = s.credentials.filter((c) => !creds[c.key]).map((c) => c.label);
  if (missing.length) return showConnectError({ kind: "request", error: `Enter your ${listOf(missing)}.` });
  state.busy = true; renderFooter(); renderSteps();
  const data = await postJson("/api/connect", { source: s.id, credentials: creds });
  state.busy = false;
  if (state.sourceId !== s.id) return;
  if (!data.ok) { showConnectError(data); renderFooter(); renderSteps(); return; }
  clearConnectError();
  state.access = data.access || {};
  state.accountName = data.accountName || null;
  state.selected = new Set(s.categories.filter((c) => readable(c).length > 0).map((c) => c.id));
  renderChoices();
  goTo("choose");
}

// ---------- 3 · choose ----------
const accessOf = (name) => state.access?.[name]?.status || "unchecked";
const readable = (cat) => cat.resources.filter((n) => ["ok", "unchecked"].includes(accessOf(n)));
const blocked = (cat) => cat.resources.filter((n) => !["ok", "unchecked"].includes(accessOf(n)));

function renderChoices() {
  const s = src();
  $("#choices").innerHTML = s.categories.map((c) => {
    const open = readable(c), shut = blocked(c);
    const none = open.length === 0;
    const denied = shut.some((n) => accessOf(n) === "denied");
    let desc = esc(c.description);
    if (none) desc = denied ? "This token can’t read any of this." : `${esc(s.label)} doesn’t have this for your account.`;
    else if (shut.length) desc += `<span class="choice-warn">${esc(`Will skip ${listOf(shut.map((n) => resLabel(n).toLowerCase()))}`)}</span>`;
    return `
    <button class="choice" type="button" role="checkbox" aria-checked="${state.selected.has(c.id)}" ${none ? 'aria-disabled="true"' : ""} data-cat="${c.id}">
      <span class="tile"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="oklch(31.2% 0.009 97.7)" stroke-width="1.4" aria-hidden="true">${CATEGORY_ICON[c.id] || CATEGORY_ICON.accounts}</svg></span>
      <span class="text"><span class="label">${esc(c.label)}</span><span>${desc}</span></span>
      <span class="radio" aria-hidden="true"></span>
    </button>`;
  }).join("");
  renderAccessNote();
  renderHistory();
}
function renderAccessNote() {
  const s = src();
  const denied = s.categories.filter((c) => state.selected.has(c.id)).flatMap(blocked).filter((n) => accessOf(n) === "denied");
  const el = $("#access-note");
  if (!denied.length) { el.hidden = true; return; }
  const items = denied.map((n) => { const sc = state.access[n].scope || s.resources[n].scope; return `<li>${esc(resLabel(n))}${sc ? ` <span class="scope">${esc(sc)}</span>` : ""}</li>`; }).join("");
  el.innerHTML = `${ICON.warn}<div class="body-col"><span class="title">This token can’t read everything</span><span class="desc">These will be skipped. To include them, give the token read access in ${esc(s.label)} and reconnect.</span><ul class="skip-list">${items}</ul></div>`;
  el.hidden = false;
}
function datedSelected() {
  const s = src();
  return s.categories.filter((c) => state.selected.has(c.id)).flatMap(readable).filter((n) => s.resources[n].dated);
}
function renderHistory() {
  const dated = datedSelected();
  $("#history-field").hidden = dated.length === 0;
  const v = $("#history").value;
  const what = listOf([...new Set(dated.map((n) => resLabel(n).toLowerCase()))]);
  const span = { all: `Everything since your ${src().label} account opened.`, "12m": "The last 12 months.", ytd: "Since January 1.", custom: "Between these dates, inclusive." }[v];
  $("#history-hint").textContent = `${span} Applies to ${what}; everything else is exported in full.`;
}
$("#choices").addEventListener("click", (e) => {
  const b = e.target.closest(".choice");
  if (!b || b.getAttribute("aria-disabled") === "true") return;
  const id = b.dataset.cat;
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  renderChoices(); renderFooter();
});

function isoDay(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dateRange() {
  if ($("#history-field").hidden) return undefined;
  const v = $("#history").value, today = new Date();
  switch (v) {
    case "all": return undefined;
    case "12m": { const from = new Date(today); from.setFullYear(from.getFullYear() - 1); return { from: isoDay(from), to: isoDay(today) }; }
    case "ytd": return { from: `${today.getFullYear()}-01-01`, to: isoDay(today) };
    case "custom": return { from: $("#from").value, to: $("#to").value };
    default: throw new Error(`Unknown history option: ${v}`);
  }
}
$("#history").addEventListener("change", () => {
  $("#custom-range").hidden = $("#history").value !== "custom";
  renderHistory();
});

// ---------- 4 · export ----------
function renderProgress() {
  const finished = state.rows.filter((r) => ["done", "skipped", "failed"].includes(r.state)).length;
  $("#files-done").textContent = `${finished} of ${state.rows.length}`;
  $("#progress-rows").innerHTML = state.rows.map((r) => {
    let meta = "Waiting", icon = ICON.upcoming;
    switch (r.state) {
      case "done": meta = fmtCount(r.count); icon = ICON.rowDone; break;
      case "running": {
        const parent = src().resources[r.name]?.parent;
        meta = r.total ? `${fmtCount(r.done)} of ${fmtCount(r.total)} ${resLabel(parent).toLowerCase()}` : "Fetching…";
        icon = ICON.rowRunning;
        break;
      }
      case "skipped": meta = "Skipped"; icon = ICON.rowSkipped; break;
      case "failed": meta = "Failed"; icon = ICON.alert; break;
    }
    return `<div class="prow" data-state="${r.state}" ${r.reason ? `title="${esc(r.reason)}"` : ""}><span class="ico">${icon}</span><span class="name">${esc(resLabel(r.name))}</span><span class="meta">${meta}</span></div>`;
  }).join("");
}

function onProgress(e) {
  const row = state.rows.find((r) => r.name === e.resource);
  switch (e.type) {
    case "plan":
      state.rows = e.resources.map((name) => ({ name, state: "waiting" }));
      break;
    case "resource_start":
      if (row) row.state = "running";
      break;
    case "resource_progress":
      if (row) Object.assign(row, { done: e.done, total: e.total });
      break;
    case "resource_done":
      if (row) Object.assign(row, { state: "done", count: e.count });
      break;
    case "resource_skipped":
      if (row) Object.assign(row, { state: e.status, reason: e.reason });
      break;
  }
  renderProgress();
}

async function startExport() {
  if (state.busy || state.selected.size === 0) return;
  const s = src();
  const range = dateRange();
  if (range && (!range.from || !range.to)) return showError($("#choose-error"), { kind: "request", error: "Pick both a start and an end date." });
  if (range && range.from > range.to) return showError($("#choose-error"), { kind: "request", error: "The start date is after the end date." });
  $("#choose-error").hidden = true;
  const categories = s.categories.filter((c) => state.selected.has(c.id)).map((c) => c.id);
  const wanted = new Set(s.categories.filter((c) => state.selected.has(c.id)).flatMap((c) => c.resources));
  state.rows = Object.keys(s.resources).filter((n) => wanted.has(n)).map((name) => ({ name, state: "waiting" }));
  $("#export-intro").textContent = s.rateLimitRps < 2
    ? `${s.label} allows about one request a second, so larger accounts can take a while. Keep this tab open.`
    : "This usually takes a few minutes. Keep this tab open.";
  $("#export-account").textContent = state.accountName || `${s.label} account`;
  renderProgress();
  goTo("export");

  const controller = new AbortController();
  state.abort = controller;
  let outcome;
  try {
    const res = await fetch("/api/export", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/x-ndjson" },
      body: JSON.stringify({ source: s.id, credentials: credentials(), categories, dateRange: range }),
      signal: controller.signal,
    });
    outcome = res.headers.get("content-type")?.includes("ndjson") ? await readStream(res) : await res.json();
  } catch (err) {
    if (err.name === "AbortError") return;
    outcome = { ok: false, network: true };
  } finally {
    if (state.abort === controller) state.abort = null;
  }
  if (state.step !== "export") return;
  if (outcome?.ok) return showReview(outcome);
  const err = outcome || { ok: false, error: "The export ended without a result." };
  if (isConnectError(err)) { showConnectError(err); goTo("connect"); }
  else { showError($("#choose-error"), err); goTo("choose"); }
}

async function readStream(res) {
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "", outcome = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
      if (!line.trim()) continue;
      const e = JSON.parse(line);
      if (e.type === "result" || e.type === "error") outcome = e;
      else onProgress(e);
    }
  }
  return outcome;
}

function cancelExport() {
  state.abort?.abort();
  state.abort = null;
  goTo("choose");
}

function lookups(sourceId, resources) {
  const by = (name, label, id = "id") => new Map((resources[name] || []).map((r) => [r[id], label(r)]));
  switch (sourceId) {
    case "ramp":
      return {
        users: by("users", fullName),
        departments: by("departments", (r) => r.name),
        entities: by("entities", (r) => r.entity_name || r.name),
        vendors: by("vendors", (r) => r.name),
        spendPrograms: by("spend-programs", (r) => r.display_name || r.name),
      };
    case "mercury":
      return {
        users: by("users", fullName, "userId"),
        accounts: by("accounts", (r) => r.nickname || r.name),
        customers: by("customers", (r) => r.name),
      };
    case "brex":
      return { users: by("users", fullName), departments: by("departments", (r) => r.name) };
    case "rho":
      return { users: new Map([...by("users", fullName), ...by("removed_users", fullName)]) };
    default:
      return {};
  }
}

    transactions: [C.name("Counterparty", (r) => r.counterparty_name), C.date("Date", (r) => r.initiated_at), C.text("Account", (r) => r.account_name), C.money("Amount", (r) => r.amount), C.status("Status", (r) => r.status, 1)],
    cards: [C.name("Card", (r) => r.name, 2), C.text("Cardholder", (r) => fullName(r.cardholder), 1.8), C.mono("Last 4", (r) => r.last_4, 0.8), C.enumv("Type", (r) => r.type, 0.9), C.status("Status", (r) => r.status)],
    scheduled_payments: [C.name("Payee", (r) => r.counterparty?.name), C.money("Amount", (r) => r.amount), C.enumv("Method", (r) => r.payment_type), C.enumv("Repeats", (r) => r.schedule?.frequency), C.id()],
    expenses: [C.name("Merchant", (r) => r.merchant_name), C.date("Date", (r) => r.transaction_date), C.text("User", (r, l) => l.users.get(r.user_id)), C.money("Amount", (r) => r.amount), C.status("Status", (r) => r.approval_status)],
    reimbursements: [C.name("Merchant", (r) => r.merchant_name), C.date("Date", (r) => r.transaction_date), C.text("User", (r, l) => l.users.get(r.user_id)), C.money("Amount", (r) => r.amount), C.status("Status", (r) => r.payment_status || r.approval_status)],
    fields: [C.name("Field", (r) => r.name, 2.4), C.enumv("Type", (r) => r.type), C.status("Status", (r) => r.status), C.id()],
    customers: [C.name("Customer", (r) => r.legal_name, 2.4), C.text("Email", (r) => r.email, 2.4), C.date("Created", (r) => r.created_at)],
    invoices: [C.name("Customer", (r) => r.customer?.legal_name || r.customer?.name), C.mono("Invoice", (r) => r.invoice_number, 1.2), C.date("Date", (r) => r.date), C.date("Due", (r) => r.due_date), C.money("Amount", (r) => r.total), C.status("Status", (r) => r.status, 1)],
  },
};
const GENERIC_PRIORITY = ["name", "display_name", "legal_name", "email", "description", "status", "state", "amount", "created_at", "createdAt", "id"];
const SENSITIVE_KEY = /(account_?number|routing_?number|tin|ein|ssn)$/i;

function columnsFor(resource, rows, l) {
  const s = src();
  const spec = (COLUMNS[s.id]?.[resource] || []).filter((c) => rows.some((r) => { const v = c.value(r, l); return v != null && v !== ""; }));
  if (spec.length >= 2) return spec;
  const keys = new Set();
  for (const r of rows.slice(0, 50)) for (const k in r) if (!SENSITIVE_KEY.test(k) && (r[k] === null || ["string", "number", "boolean"].includes(typeof r[k]))) keys.add(k);
  const ordered = [...GENERIC_PRIORITY.filter((k) => keys.has(k)), ...[...keys].sort().filter((k) => !GENERIC_PRIORITY.includes(k))].slice(0, 6);
  return ordered.map((k, i) => ({ label: humanize(k), kind: i === 0 ? "name" : /(^id$|_id$|Id$)/.test(k) ? "mono" : "", w: 1, value: (r) => r[k] }));
}

function cellHtml(col, v) {
  if (v === null || v === undefined || v === "") return '<span class="subtle">—</span>';
  switch (col.kind) {
    case "name": {
      const s = String(v);
      return `<span class="who"><span class="letter">${esc(s.trim()[0]?.toUpperCase() || "?")}</span><span>${esc(s)}</span></span>`;
    }
    case "mono": return `<span class="mono">${esc(v)}</span>`;
    case "date": return esc(fmtShortDate(v) || v);
    case "money": {
      const m = money(v);
      return m ? esc(m.text) : '<span class="subtle">—</span>';
    }
    case "status": return `<span class="tag ${tone(v)}">${esc(humanize(v))}</span>`;
    case "enum": return esc(humanize(v));
    default: return esc(typeof v === "object" ? JSON.stringify(v) : v);
  }
}

function showReview(result) {
  state.result = result;
  state.exportedAt = new Date();
  state.lookups = lookups(state.sourceId, result.resources || {});
  state.tab = presentCategories()[0]?.id || null;
  state.resource = null;
  renderReview();
  goTo("review");
}

const exported = (name) => name in (state.result.counts || {}) || name in (state.result.skipped || {});
const count = (name) => state.result.counts?.[name] ?? 0;
const skippedOf = (name) => state.result.skipped?.[name];
const presentCategories = () => src().categories.filter((c) => c.resources.some(exported));

function renderReview() {
  const r = state.result, s = src();
  const names = Object.keys(r.counts || {});
  const complete = names.filter((n) => !skippedOf(n));
  const total = complete.reduce((sum, n) => sum + count(n), 0);
  const when = state.exportedAt.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  const dot = '<span class="subtle">·</span>';
  $("#agg").innerHTML = [`<b>${fmtCount(total)}</b> records`, `<b>${complete.length}</b> files`, esc(state.accountName || s.label), esc(when)].join(dot);
  $("#bundle-path").textContent = r.bundleDir || "";
  $("#bundle-path").title = r.bundleDir || "";

  const skipped = Object.entries(r.skipped || {});
  const sn = $("#skipped-note");
  if (skipped.length) {
    const items = skipped.map(([n, m]) => `<li><b>${esc(resLabel(n))}</b> — ${esc(m.reason || m.status)}</li>`).join("");
    sn.innerHTML = `${ICON.warn}<div class="body-col"><span class="title">${skipped.length === 1 ? "1 file" : `${skipped.length} files`} couldn’t be exported</span><span class="desc">Everything else is complete. The manifest records what was skipped and why.</span><ul class="skip-list">${items}</ul></div>`;
  }
  sn.hidden = !skipped.length;

  const sensitive = complete.filter((n) => s.resources[n]?.sensitive && count(n) > 0);
  const sens = $("#sensitive-note");
  if (sensitive.length) {
    const which = listOf(sensitive.map((n, i) => (i ? resLabel(n).toLowerCase() : resLabel(n))));
    sens.innerHTML = `${ICON.lock}<div class="body-col"><span class="title">This folder contains full bank account numbers</span><span class="desc">${esc(which)} include${sensitive.length === 1 ? "s" : ""} complete account and routing numbers, exactly as ${esc(s.label)} returned them. They’re masked here. Keep the folder private and delete it once you’ve moved.</span></div>`;
  }
  sens.hidden = !sensitive.length;

  const present = presentCategories();
  $("#tabs").innerHTML = present.map((c) => {
    const n = c.resources.reduce((sum, x) => sum + (exported(x) ? count(x) : 0), 0);
    return `<button class="tab" type="button" role="tab" aria-selected="${c.id === state.tab}" data-tab="${c.id}">${esc(c.label)} <span class="count">${fmtCount(n)}</span></button>`;
  }).join("");

  const cat = s.categories.find((c) => c.id === state.tab);
  const resources = cat ? cat.resources.filter(exported) : [];
  if (!resources.includes(state.resource)) state.resource = resources.find((n) => count(n) > 0) || resources[0] || null;
  $("#pills").innerHTML = resources.map((n) => {
    const sk = skippedOf(n);
    return `<button class="pill" type="button" aria-pressed="${n === state.resource}" data-resource="${n}">${esc(resLabel(n))} ${sk ? `<span class="tag ${sk.status === "failed" ? "danger" : ""}">${sk.status === "failed" ? "Failed" : "Skipped"}</span>` : `<span class="n">${fmtCount(count(n))}</span>`}</button>`;
  }).join("");
  renderTable();
}
$("#tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  state.tab = t.dataset.tab; state.resource = null;
  renderReview();
});
$("#pills").addEventListener("click", (e) => {
  const p = e.target.closest(".pill");
  if (!p) return;
  state.resource = p.dataset.resource;
  renderReview();
});

function renderTable() {
  const name = state.resource;
  const rows = (name && state.result.resources?.[name]) || [];
  const label = (name ? resLabel(name) : "records").toLowerCase();
  const sk = name && skippedOf(name);
  if (sk) {
    $("#table").innerHTML = `<div class="empty">${esc(sk.reason || "This couldn’t be exported.")}</div>`;
    $("#table-caption").textContent = "";
    return;
  }
  if (!rows.length) {
    $("#table").innerHTML = `<div class="empty">No ${esc(label)} in this export.</div>`;
    $("#table-caption").textContent = "";
    return;
  }
  const cols = columnsFor(name, rows, state.lookups);
  state.cols = cols;
  const shown = rows.slice(0, TABLE_LIMIT);
  const total = count(name);
  const head = cols.map((c) => `<th${c.kind === "money" ? ' class="num-col"' : ""}>${esc(c.isId ? `${src().label} ID` : c.label)}</th>`).join("");
  const body = shown.map((row, i) => `<tr data-i="${i}" tabindex="0">${cols.map((c) =>
    `<td class="${c.kind === "money" ? "num-col money" : ""}">${cellHtml(c, c.value(row, state.lookups))}</td>`).join("")}</tr>`).join("");
  const totalW = cols.reduce((sum, c) => sum + c.w, 0);
  $("#table").innerHTML = `<table><colgroup>${cols.map((c) => `<col style="width:${(c.w / totalW) * 100}%">`).join("")}</colgroup><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  $("#table-caption").textContent = total > shown.length
    ? `Showing the first ${fmtCount(shown.length)} of ${fmtCount(total)} ${label}. Click a row to see the raw record. Everything is in the folder.`
    : `Showing all ${fmtCount(total)} ${label}. Click a row to see the raw record.`;
}
$("#table").addEventListener("click", (e) => {
  const tr = e.target.closest("tbody tr");
  if (tr) openDrawer(Number(tr.dataset.i), tr);
});
$("#table").addEventListener("keydown", (e) => {
  const tr = e.target.closest("tbody tr");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDrawer(Number(tr.dataset.i), tr); }
});

function copyButton(btn, text) {
  navigator.clipboard?.writeText(text);
  const label = btn.querySelector("span"), was = label.textContent;
  label.textContent = "Copied";
  setTimeout(() => (label.textContent = was), 1400);
}
$("#copy-path").addEventListener("click", (e) => copyButton(e.currentTarget, state.result?.bundleDir || ""));

async function revealFolder() {
  const data = await postJson("/api/reveal", { bundleDir: state.result?.bundleDir });
  if (!data.ok) copyButton($("#copy-path"), state.result?.bundleDir || "");
}

// ---------- drawer ----------
let lastFocus = null;
function openDrawer(i, tr) {
  const s = src(), name = state.resource, row = state.result.resources[name][i], cols = state.cols, l = state.lookups;
  const def = s.resources[name];
  document.querySelectorAll("tbody tr.selected").forEach((x) => x.classList.remove("selected"));
  tr.classList.add("selected");
  lastFocus = tr;

  const val = (c) => c.value(row, l);
  const rowId = row[def?.idField || "id"];
  const nameCol = cols.find((c) => c.kind === "name");
  const title = (nameCol && val(nameCol)) || rowId || def?.one || "Record";
  const secondary = cols.find((c) => c !== nameCol && !c.isId && ["mono", ""].includes(c.kind || "") && val(c) != null);
  const moneyCol = cols.find((c) => c.kind === "money" && val(c) != null);
  const statusCol = cols.find((c) => c.kind === "status" && val(c) != null);
  const dateCols = cols.filter((c) => c.kind === "date" && val(c) != null);
  const metaDate = dateCols[dateCols.length - 1];
  const amount = moneyCol && money(val(moneyCol));

  const details = cols.filter((c) => c !== nameCol && c !== moneyCol && c !== statusCol && !c.isId && val(c) != null)
    .map((c) => {
      const v = val(c);
      const text = c.kind === "date" ? fmtLongDate(v) || v : c.kind === "enum" ? humanize(v) : c.kind === "money" ? money(v)?.text || "" : typeof v === "object" ? JSON.stringify(v) : v;
      return `<div><dt>${esc(c.label)}</dt><dd class="${c.kind === "mono" ? "mono" : ""}">${esc(text)}</dd></div>`;
    });
  if (rowId != null) details.push(`<div><dt>${esc(s.label)} ID</dt><dd class="mono" title="${esc(rowId)}">${esc(rowId)}</dd></div>`);
  const json = JSON.stringify(row, null, 2);

  $("#drawer-panel").innerHTML = `
    <div class="panel-head">
      <div class="avatar">${esc(String(title).trim()[0]?.toUpperCase() || "?")}</div>
      <div class="name" id="drawer-name">${esc(title)}</div>
      <div>${esc(def?.one || "Record")}${secondary ? ` · ${esc(secondary.label === "Invoice" ? `Invoice ${val(secondary)}` : val(secondary))}` : ""}</div>
      ${amount ? `<div class="amount">${esc(amount.text)} <small>${esc(amount.code)}</small></div>` : ""}
      ${statusCol ? `<div class="status-card"><span class="tag lg ${tone(val(statusCol))}">${esc(humanize(val(statusCol)))}</span>${
        metaDate ? `<span>${esc(metaDate.label)} ${esc(fmtLongDate(val(metaDate)) || "")}</span>` : ""}</div>` : ""}
    </div>
    <div class="panel-body">
      ${details.length ? `<dl class="details" style="margin:0">${details.join("")}</dl>` : ""}
      <div>
        <div class="raw-head"><span class="overline">Raw record</span>
          <button class="btn outline xs" type="button" id="copy-json">${ICON.copy}<span>Copy JSON</span></button></div>
        <div class="caption subtle" style="margin-top:8px">${esc(name)}.jsonl · line ${fmtCount(i + 1)}</div>
        <pre class="json">${esc(json)}</pre>
      </div>
    </div>`;
  $("#copy-json").addEventListener("click", (e) => copyButton(e.currentTarget, json));
  $("#drawer").hidden = false;
  $("#drawer .close").focus();
}
function closeDrawer() {
  $("#drawer").hidden = true;
  document.querySelectorAll("tbody tr.selected").forEach((x) => x.classList.remove("selected"));
  lastFocus?.focus();
}
$("#drawer").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeDrawer(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });

// ---------- boot ----------
async function boot() {
  goTo("platform");
  try {
    const res = await fetch("/api/sources");
    state.sources = (await res.json()).sources;
  } catch {
    showError($("#platform-error"), { network: true });
    return;
  }
  const wanted = new URLSearchParams(location.search).get("source");
  if (state.sources.some((s) => s.id === wanted)) state.pickedId = wanted;
  renderPlatforms();
  renderFooter();
}
boot();
</script>
</body>
</html>
